services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_app
    volumes:
      - .:/var/www/html
    networks:
      - laravel

  webserver:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8082:80"
    volumes:
      - type: bind
        source: C:/Users/Lenovo/Main/sync/medicus/nginx.conf
        target: /etc/nginx/nginx.conf
        consistency: delegated
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: medicus
      MYSQL_DATABASE: medicus
      MYSQL_USER:
      MYSQL_PASSWORD:
    ports:
      - "3306:3306"
    networks:
      - laravel

networks:
  laravel:
